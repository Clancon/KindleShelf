name: Regression and Docker

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.10", "3.12"]
    env:
      QT_QPA_PLATFORM: offscreen
      REQUIRE_CALIBRE: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install Calibre on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install calibre --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Calibre installation failed" }
          "EBOOK_CONVERT=C:\Program Files\Calibre2\ebook-convert.exe" >> $env:GITHUB_ENV
      - name: Install Calibre on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y calibre fonts-noto-cjk
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Require the real converter
        run: python -c "from kindle_shelf.converter import CalibreConverter; assert CalibreConverter().available, 'Calibre is required for CI'"
      - name: Lint
        run: python -m ruff check .
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Regression tests
        run: python -m pytest --junitxml=regression-results.xml

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Audit pinned runtime dependencies
        run: python -m pip_audit --require-hashes --disable-pip -r requirements.txt

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Validate Compose
        run: |
          mkdir -p data
          sudo chown 10001:10001 data
          docker compose config --quiet
      - name: Build and exercise the container
        run: python scripts/docker_smoke.py
