<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}Kindle Shelf{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('index') }}">Kindle Shelf <span>v{{ app_version }}</span></a>
    <nav><a href="{{ url_for('index') }}">管理</a><a href="{{ url_for('stats_page') }}">阅读统计</a><a href="{{ url_for('kindle') }}">Kindle 页面</a><a href="{{ url_for('help_page') }}">使用帮助</a></nav>
  </header>
  <main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}<div class="notice {{ category }}">{{ message }}</div>{% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
